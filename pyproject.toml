[project]
name = "rag"
version = "0.1.0"
description = "RAG monorepo (Python components)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "uvicorn>=0.30.0",
  "alembic>=1.20.1",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.10.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pre-commit>=4.0.0",
  "ruff>=0.15.0",
  "mypy>=1.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# apps/api contains an `alembic/` scripts dir; the migrations tool itself is
# the installed third-party package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
