# README — optional PostgreSQL + pgvector integration tests
#
# 1. Start the database:
#      docker compose -f docker-compose.test.yml up -d
# 2. Run the suite:
#      TEST_DATABASE_URL=postgresql://test:test@localhost:5433/rag_test .venv/Scripts/python.exe -m pytest apps/api/tests/test_postgres_integration.py -q
#
# Without TEST_DATABASE_URL the suite starts a pgvector testcontainer if Docker
# is available, and otherwise skips cleanly.

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rag_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rag_test"]
      interval: 5s
      timeout: 5s
      retries: 10
