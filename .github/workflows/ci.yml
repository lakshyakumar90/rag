name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.13"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups --no-install-project
      - name: Ruff lint
        run: uv run ruff check apps/api evals
      - name: Ruff format
        run: uv run ruff format --check apps/api evals
      - name: Mypy
        run: uv run mypy apps/api evals/evaluate.py --no-incremental
      - name: Pytest
        run: uv run pytest -q

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The pnpm lockfile is maintained locally; resolve from package.json here.
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm check-types
      - name: Next.js build
        run: pnpm build
      - name: Discover Playwright specs
        run: pnpm --filter web exec playwright test --config e2e/playwright.config.ts --list

  integration:
    name: API — Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups --no-install-project
      - name: Real Postgres tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/rag_test
        run: uv run pytest apps/api/tests/test_postgres_integration.py -q

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: rag-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: rag-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
