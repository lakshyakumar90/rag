# Loaded automatically by `docker compose up` for local development.
# Production-style runs can opt out with: docker compose -f docker-compose.yml up
services:
  api:
    # uvicorn reloads whenever source under /app/apps/api changes; the bind
    # mount below maps that path back to the host working tree.
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/apps/api
    volumes:
      - ./apps/api:/app/apps/api
